<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayen Art Gallery</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap');

body{
    margin:0;
    font-family:'Playfair Display', serif;
    background: linear-gradient(135deg,#001f3f,#0077b6,#00b4d8,#caf0f8);
    background-size:400% 400%;
    animation: ocean 12s ease infinite;
    color:white;
}

/* animation background */
@keyframes ocean{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* HEADER */
header{
    text-align:center;
    padding:50px 20px;
    background:rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
    border:2px solid white;
    display:inline-block;
    padding:10px 20px;
    border-radius:50px;
    margin-bottom:15px;
}

h1{
    margin:10px 0;
    font-size:3em;
}

p{
    opacity:0.9;
}

/* GALLERY */
.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap:25px;
    padding:50px;
}

.art{
    background:rgba(255,255,255,0.1);
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.4s;
    backdrop-filter: blur(10px);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.art:hover{
    transform:scale(1.05);
}

.art img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.art h3{
    margin:10px;
}

.art p{
    margin-bottom:15px;
    font-size:14px;
    opacity:0.8;
}

/* CONTACT */
.contact{
    text-align:center;
    padding:40px;
    background:rgba(0,0,0,0.4);
}

.contact a{
    color:#00d4ff;
    text-decoration:none;
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup img{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
}
</style>

</head>

<body>

<header>

<div class="logo">RAG</div>

<h1>Rayen Art Gallery</h1>

<p>Ocean • Nature • Art • Emotion</p>

</header>

<section>

<h2 style="text-align:center;">Featured Artwork</h2>

<div class="gallery">

<div class="art" onclick="openImg('orca.jpg')">
    <img src="orca.jpg">
    <h3>Orca Painting</h3>
    <p>Ocean Spirit Artwork</p>
</div>

<div class="art" onclick="openImg('shark.jpg')">
    <img src="shark.jpg">
    <h3>Shark Artwork</h3>
    <p>Power of the Sea</p>
</div>

<div class="art" onclick="openImg('portrait.jpg')">
    <img src="portrait.jpg">
    <h3>Portrait Drawing</h3>
    <p>Human Emotion Art</p>
</div>

</div>

</section>

<div class="contact">

<h2>Contact</h2>

<p>Email: rayen.mbarek@gmail.com</p>

<p>
Instagram:
<a href="https://www.instagram.com/rayen_m.barek?igsh=NGVrb2NlcnFrMGxo" target="_blank">
@rayen_m.barek
</a>
</p>

</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closeImg()">
    <img id="popupImg">
</div>

<script>
function openImg(src){
    document.getElementById("popup").style.display = "flex";
    document.getElementById("popupImg").src = src;
}

function closeImg(){
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
